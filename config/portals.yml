# NO usar LinkedIn. Fuentes adaptadas al CV (Espana, JS/React/Next/Node, IA/automatizacion).
excluded_domains:
  - linkedin.com

# PRIORIDAD 1: empresas que NO aparecen en portales grandes (pymes, agencias, startups, factorias de software)
small_companies_discovery:
  how:
    - Buscar en Google/Bing con dorks: "trabaja con nosotros" desarrollador web junior Gipuzkoa / Bizkaia / Alava / Navarra / remoto Espana
    - Buscar: "estamos contratando" OR "unete a nuestro equipo" desarrollador react / node / full stack + ciudad
    - Buscar en paginas de empresa: /careers, /empleo, /trabaja-con-nosotros, /jobs, /join-us
    - Directorios de empresas tech locales: Cluster GAIA, Basque Digital Innovation Hub (BDIH), Beaz/Bizkaia Talent, Fomento San Sebastian, Parque Tecnologico Gipuzkoa/Zamudio/Alava, Barrio Tecnologico, Bilbao Berrikuntza, Digital Basque Country
    - Agencias web, estudios de desarrollo, ecommerce (Shopify/WordPress/PrestaShop), consultoras de IA/automatizacion, startups locales (Wellfound, Crunchbase ES, Startup Spain)
    - Redes sociales NO-LinkedIn: X/Twitter, Reddit (r/empleo, r/programacion, r/devsarg), Telegram/Discord de empleo dev en espanol, Mastodon, GitHub Jobs-style repos y READMEs 'hiring'
    - Hacker News 'Who is hiring' (filtrar Espana/sin ingles) y comunidades hispanas de empleo tech
  rules:
    - Evitar grandes multinacionales y consultoras gigantes; buscar equipos de 2-100 personas
    - Registrar la web de la empresa en data/seen.csv aunque no haya oferta abierta: contacto directo (email/formulario) como candidatura espontanea sugerida

# PRIORIDAD 2: portales pequenos / ATS directos
small_boards:
  - name: Lanbide / Euskadi Empleo
    url: https://www.lanbide.euskadi.eus/
  - name: Jooble / Talent.com / Jobtoday / Opcionempleo
    url: https://es.jooble.org/
  - name: Trabajos.com / Milanuncios Empleo / Joblers / Domestika Jobs
  - name: Remote OK / We Work Remotely / Remotive / Working Nomads (solo ofertas sin ingles)
  - name: Wellfound / Torre / Otta (solo si no piden ingles)
  - name: ATS directos de empresas espanolas
    queries:
      - site:boards.greenhouse.io Espana desarrollador
      - site:jobs.lever.co Espana desarrollador
      - site:jobs.ashbyhq.com Spain developer
      - site:*.workable.com Espana desarrollador web
      - site:*.teamtailor.com desarrollador web Espana
      - site:*.personio.de/job desarrollador Espana
      - site:*.recruitee.com desarrollador web Espana
      - site:*.bamboohr.com/careers desarrollador Espana

# PRIORIDAD 3: portales grandes (solo como complemento)
big_boards:
  - Tecnoempleo, InfoJobs, Indeed Espana, Glassdoor Espana, Welcome to the Jungle Espana

search_tips:
  - frases clave: "no se requiere titulacion", "sin titulacion", "certificado de profesionalidad", "valorable formacion", "2 anios de experiencia", "salario 24.000", "2.000 EUR/mes", "teletrabajo", "100% remoto"
