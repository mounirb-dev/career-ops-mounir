candidate:
  name: Mounir Bella
  location: Bergara, Gipuzkoa, Pais Vasco, Espana
  language_cv: es
  experience_years: 2
target_roles:
  - Desarrollador Web Junior / Semi-senior
  - Desarrollador Full Stack (JavaScript / Node.js)
  - Desarrollador Frontend (React / Next.js)
  - Desarrollador Node.js
  - Automatizacion / IA aplicada (n8n, integraciones con LLM)
  - Desarrollador WordPress / web
seniority: junior-mid (2 anios de experiencia practica)
filters:
  # PRIORIDAD 1: ofertas que NO exijan titulacion academica (valen certificados Lanbide / portfolio / experiencia)
  prefer_no_degree_required: true
  # PRIORIDAD 2: salario >= 2000 EUR/mes (equivale a >= 24000 EUR/anio bruto). Si no hay salario publicado, marcar 'salario?' y puntuar menos.
  min_salary_eur_month: 2000
  min_salary_eur_year_gross: 24000
  # INGLES: se acepta ingles BASICO. Sirve en ofertas remotas y startups de IA.
  english_policy:
    accepted: [ninguno, basico, A1, A2, 'lectura de documentacion tecnica', 'ingles basico valorable']
    penalize: ['ingles intermedio B1', 'conversacional']   # puntuar menos, no descartar de golpe
    reject: ['B2', 'C1', 'C2', 'fluido', 'bilingue', 'native', 'ingles avanzado', 'entrevista en ingles']
  max_experience_required_years: 3   # 2 anios reales; aceptar hasta '2-3 anios'
  geography:
    on_site_hybrid: [Gipuzkoa, Bizkaia, Alava, Navarra, Pais Vasco]
    remote: Espana
discard_if:
  - exige grado/ingenieria/titulacion universitaria obligatoria
  - exige 4+ anios de experiencia
  - exige ingles B2 o superior / fluido / avanzado
  - salario publicado < 2000 EUR/mes
  - es de LinkedIn (no usar LinkedIn como fuente)
  - empresa ya registrada en data/seen.csv
source_priority:
  - 1: startups y empresas de IA/automatizacion (config/ai_startups.yml)
  - 1: paginas 'trabaja con nosotros' / careers de pymes, agencias web y software factories (config/portals.yml)
  - 2: portales pequenos / ATS directos / comunidades
  - 3: portales grandes (Tecnoempleo, InfoJobs, Indeed)
scoring:
  threshold_apply: 4.0
  weights:
    match_tecnologias: 0.30
    sin_titulacion_requerida: 0.25
    salario_>=2000: 0.20
    ingles_compatible_basico: 0.15
    ubicacion_remoto_o_cerca: 0.10
